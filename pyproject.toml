[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: calls live GDC, Ensembl or UniProt services",
    "models: needs downloaded MHCflurry models",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
